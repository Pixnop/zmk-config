# Corne Wireless Mechboards - BEPO layout
# Board: nice_nano_v2 (compatible with SuperMini nRF52840)
# Display: nice!view cyberpunk Arasaka (siddhantac/nice-view)
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_custom
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_custom
  - board: nice_nano_v2
    shield: settings_reset
