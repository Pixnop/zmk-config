# Corne Wireless Mechboards - BEPO layout
# Board: nice_nano_v2 (compatible with SuperMini nRF52840)
# Display: nice!view (MIP) via nice_view_adapter + nice_view_gem
---
include:
  - board: nice_nano_v2
    shield: corne_left nice_view_adapter nice_view_gem
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y
  - board: nice_nano_v2
    shield: corne_right nice_view_adapter nice_view_gem
  - board: nice_nano_v2
    shield: settings_reset
