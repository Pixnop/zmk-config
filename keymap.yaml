draw_config:
  n_columns: 2
  draw_key_sides: true
  key_w: 52
  key_h: 48
  split_gap: 20
  combo_w: 24
  combo_h: 22
  inner_pad_w: 2
  inner_pad_h: 2
  outer_pad_w: 20
  outer_pad_h: 36
  footer_text: "Corne 42 — BÉPO · Activer le layout BÉPO côté OS"
  svg_extra_style: |
    svg { font-family: 'Inter', 'Segoe UI', sans-serif; }
    rect.key { fill: #f5f5f5; stroke: #cccccc; }
    rect.key.held { fill: #ffeebb; }
    rect.key.trans { fill: #fafafa; }
    rect.key.bootloader { fill: #ffcccc; }
    text.tap { font-weight: 600; }
    text.hold { fill: #007aff; }
    text.shifted { fill: #888888; }
    rect.combo { fill: #fff3e0; stroke: #ff9800; }
