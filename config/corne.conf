# Display (nice!view via zmk-nice-oled module)
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# nice-oled: nice!view e-paper mode
CONFIG_NICE_EPAPER_ON=y

# Inverted colors (white on black = cyberpunk)
CONFIG_NICE_OLED_WIDGET_INVERTED=y

# Show WPM (typing speed)
CONFIG_NICE_OLED_WIDGET_WPM=y

# Show active modifiers in real-time
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=y

# Show HID indicators (caps lock, etc.)
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=y

# ZMK Studio
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO=y

# Bluetooth TX power
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
