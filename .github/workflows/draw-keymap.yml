name: Draw Keymap

on:
  push:
    paths:
      - "config/*.keymap"
  workflow_dispatch:

jobs:
  draw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: caksoylar/keymap-drawer@main
        with:
          keymap_path: config/corne.keymap
          output_folder: keymap-img

      - name: Upload SVG
        uses: actions/upload-artifact@v4
        with:
          name: keymap-svg
          path: keymap-img/
